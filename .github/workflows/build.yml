name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project JAV.xcodeproj \
            -scheme JAV \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tail -40

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -name "JAV.app" -type d | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y JAV.ipa Payload/
          ls -la JAV.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAV-unsigned-ipa
          path: JAV.ipa
          retention-days: 30
